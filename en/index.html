<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Help Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#111827;--muted:#4b5563;--line:#e5e7eb;--accent:#1a8917;--soft:#e8f3e7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#f3f4f6;--muted:#a1a1aa;--line:#272b34;--accent:#4ade80;--soft:#14261a}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.75}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{font-weight:700;font-size:1.05rem;color:var(--ink);text-decoration:none}
.lang{font-size:.9rem;text-decoration:none;border:1px solid var(--line);padding:4px 12px;border-radius:999px;color:var(--ink)}
.hero{padding:56px 0 28px}.tag{color:var(--accent);font-weight:600;font-size:.9rem}
h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.25;margin:.3rem 0 1rem}
.lead{color:var(--muted);font-size:1.08rem;max-width:760px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 8px;padding:0;list-style:none}
.toc a{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);padding:6px 14px;border-radius:999px;color:var(--ink);font-size:.92rem}
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;margin:22px 0}
h2{margin:0 0 .4rem;font-size:1.45rem}h3{font-size:1rem;margin:1.2rem 0 .3rem;color:var(--muted)}
section img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);margin:14px 0 4px;display:block}
ul{padding-inline-start:1.2rem;margin:.4rem 0}li{margin:.25rem 0}
.num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:700;font-size:.85rem;margin-inline-end:8px;vertical-align:middle}
.contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:10px 18px;border-radius:10px;font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:12px}.tgrid figure{margin:0}.tgrid img{margin:0;width:100%;height:auto;border-radius:12px;aspect-ratio:4/5;object-fit:cover;object-position:top}.tgrid figcaption{text-align:center;font-weight:600;margin-top:6px}
footer{color:var(--muted);font-size:.85rem;padding:30px 0 50px;text-align:center}
@media (max-width:600px){section{padding:20px;border-radius:14px}.wrap{padding:0 16px}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}.card{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.card img{width:100%;height:auto;display:block}.card div{padding:16px 18px}.card h2{font-size:1.2rem;margin:0 0 4px}.card p{margin:0;color:var(--muted)}</style></head><body>
<header><div class="wrap"><span class="brand">Help Center</span><a class="lang" href="../">العربية</a></div></header>
<main class="wrap"><div class="hero"><h1>Help Center</h1><p class="lead">User guides and support for our Salla products.</p></div>
<div class="cards"><a class="card" href="../conversion-boost/en/"><img src="../conversion-boost/img/1-hero.jpg" alt="" loading="lazy" width="1600" height="900"><div><h2>Conversion Boost Kit</h2><p>Nine elements and five landing page templates to get more orders.</p></div></a></div>
<section><h2>Contact us</h2><div class="contact"><a class="btn" href="https://wa.me/966592179238">WhatsApp: +966 59 217 9238</a><a class="btn alt" href="mailto:tarek.ly.77@gmail.com">tarek.ly.77@gmail.com</a></div></section>
</main><footer>help.oarood.com</footer></body></html>
